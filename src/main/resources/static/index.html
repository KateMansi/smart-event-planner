<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plan your wedding, birthday, corporate event or party with a smart budget and checklist.">
  <title>Smart Event Planner</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>

  <header>
    <h1 data-i18n="title">Smart Event Planner</h1>
    <p data-i18n="subtitle">Tell us about your event and get a budget, checklist and tips.</p>
  </header>

  <main id="main">
    <form id="plan-form">
      <div class="field">
        <label for="language" data-i18n="language">Language</label>
        <select id="language" name="language">
          <option value="ENGLISH">English</option>
          <option value="HINDI">हिंदी</option>
          <option value="MARATHI">मराठी</option>
        </select>
      </div>

      <div class="field">
        <label for="type" data-i18n="type">Event type</label>
        <select id="type" name="type" required>
          <option value="WEDDING" data-i18n="wedding">Wedding</option>
          <option value="BIRTHDAY" data-i18n="birthday">Birthday</option>
          <option value="CORPORATE" data-i18n="corporate">Corporate</option>
          <option value="PARTY" data-i18n="party">Party</option>
        </select>
      </div>

      <div class="field">
        <label for="date" data-i18n="date">Event date</label>
        <input id="date" name="date" type="date" required>
      </div>

      <div class="field">
        <label for="budget" data-i18n="budget">Budget (₹)</label>
        <input id="budget" name="budget" type="number" inputmode="numeric"
               min="1000" max="100000000" step="1" required>
      </div>

      <div class="field">
        <label for="guests" data-i18n="guests">Number of guests</label>
        <input id="guests" name="guests" type="number" inputmode="numeric"
               min="1" max="5000" step="1" required>
      </div>

      <div class="field">
        <label for="city" data-i18n="city">City</label>
        <input id="city" name="city" type="text" maxlength="60" autocomplete="address-level2" required>
      </div>

      <div class="field">
        <label for="diet" data-i18n="diet">Food preference</label>
        <select id="diet" name="diet" required>
          <option value="VEG" data-i18n="veg">Vegetarian</option>
          <option value="NON_VEG" data-i18n="nonveg">Non-vegetarian</option>
          <option value="JAIN" data-i18n="jain">Jain</option>
          <option value="HALAL" data-i18n="halal">Halal</option>
        </select>
      </div>

      <div class="field check">
        <input id="outdoor" name="outdoor" type="checkbox">
        <label for="outdoor" data-i18n="outdoor">This is an outdoor event</label>
      </div>

      <div class="field wide">
        <label for="notes" data-i18n="notes">Special notes (optional)</label>
        <textarea id="notes" name="notes" rows="3" maxlength="500"></textarea>
      </div>

      <div class="field wide">
        <button id="submit" type="submit" data-i18n="submit">Create my plan</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite" class="status"></div>
    <div id="error" role="alert" class="error" hidden></div>

    <section id="results" hidden aria-labelledby="results-title">
      <h2 id="results-title" tabindex="-1" data-i18n="resultsTitle">Your event plan</h2>
      <p id="summary-line"></p>

      <h3 data-i18n="budgetTitle">Budget breakdown</h3>
      <div class="table-wrap">
        <table>
          <caption class="sr-only" data-i18n="budgetTitle">Budget breakdown</caption>
          <thead>
            <tr>
              <th scope="col" data-i18n="category">Category</th>
              <th scope="col" class="num" data-i18n="amount">Amount</th>
            </tr>
          </thead>
          <tbody id="budget-body"></tbody>
        </table>
      </div>

      <h3 data-i18n="checklistTitle">Checklist</h3>
      <ul id="checklist"></ul>

      <h3 data-i18n="warningsTitle">Things to watch</h3>
      <ul id="warnings"></ul>
      <p id="no-warnings" hidden></p>

      <h3 data-i18n="aiTitle">AI summary</h3>
      <p id="ai-summary" class="ai"></p>
    </section>
  </main>

  <footer>
    <p>Smart Event Planner</p>
  </footer>
</body>
</html>
